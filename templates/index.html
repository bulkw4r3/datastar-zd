<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Storage</title>
    <script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@1.0.0-beta.11/bundles/datastar.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 700px;
        }
        h1 {
            color: #333;
            margin-bottom: 8px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        .hint {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 14px;
        }
        th {
            background: #f8f9fa;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #555;
            border-bottom: 2px solid #e0e0e0;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
            color: #333;
        }
        .table-container {
            margin-top: 32px;
        }
        .table-container h2 {
            color: #333;
            margin-bottom: 16px;
            font-size: 20px;
        }
        .empty-state {
            text-align: center;
            color: #999;
            padding: 20px;
        }
        #message {
            min-height: 24px;
            margin-bottom: 16px;
            font-weight: 500;
        }
        .success { color: #16a34a; }
        .error { color: #dc2626; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Number Storage</h1>
        <p class="subtitle">Store your numbers securely with Datastar + FastAPI + Turso</p>

        <div id="message"></div>

        <form data-on:submit="@post('/api/numbers', {contentType: 'form'})">
            <div class="form-group">
                <label for="seven_digit">Seven Digit Number</label>
                <input
                    type="text"
                    id="seven_digit"
                    name="seven_digit"
                    placeholder="1234567"
                    maxlength="7"
                    pattern="[0-9]{7}"
                    required
                >
                <p class="hint">Enter exactly 7 digits (e.g., 1234567)</p>
            </div>

            <div class="form-group">
                <label for="long_digit">Long Number (10-14 digits)</label>
                <input
                    type="text"
                    id="long_digit"
                    name="long_digit"
                    placeholder="1234567890"
                    minlength="10"
                    maxlength="14"
                    pattern="[0-9]{10,14}"
                    required
                >
                <p class="hint">Enter between 10 and 14 digits</p>
            </div>

            <button type="submit">Store Numbers</button>
        </form>

        <div class="table-container">
            <h2>Stored Numbers</h2>
            <div class="overflow-x-auto">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>7-Digit</th>
                            <th>Long Number</th>
                            <th>Created At</th>
                        </tr>
                    </thead>
                    <tbody id="numbers-table">
                        <tr>
                            <td colspan="4" class="empty-state">No numbers stored yet</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
